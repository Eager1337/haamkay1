name: Deploy Supabase Edge Functions
# Uses API deployment mode to avoid Docker/CI deployment races.

on:
  push:
    branches:
      - github-sync
    paths:
      - 'supabase/functions/ai-product-draft/**'
      - 'supabase/functions/_shared/**'
      - 'supabase/config.toml'
  workflow_dispatch:

jobs:
  deploy-ai-product-draft:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.13.3

      - name: Deploy ai-product-draft
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          # Project ref verified from the Supabase project dashboard URL.
          supabase functions deploy ai-product-draft --use-api --project-ref dkduukiesklpivqccnco --no-verify-jwt
