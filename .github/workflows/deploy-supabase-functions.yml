name: Deploy Supabase Edge Functions
# Deploy all AI edge functions to the Supabase project used by the production frontend.

on:
  push:
    branches:
      - github-sync
    paths:
      - 'supabase/functions/**'
      - 'supabase/config.toml'
  workflow_dispatch:

jobs:
  deploy-ai-functions:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.13.3

      - name: Deploy AI functions to production Supabase project
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          # This is the project referenced by VITE_SUPABASE_URL in the production frontend.
          for fn in ai-product-draft ai-image-studio ai-image-upscale ai-team-bio; do
            supabase functions deploy "$fn" --use-api --project-ref pcwyueagjkabmieoccew --no-verify-jwt
          done
