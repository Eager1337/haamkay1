name: Deploy Supabase Edge Functions
# Deploy the AI listing function to the Supabase project used by the production frontend.

on:
  push:
    branches:
      - github-sync
    paths:
      - 'supabase/functions/ai-product-draft/**'
      - 'supabase/functions/_shared/**'
      - 'supabase/config.toml'
  workflow_dispatch:

jobs:
  deploy-ai-product-draft:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.13.3

      - name: Deploy ai-product-draft to production Supabase project
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          # This is the project referenced by VITE_SUPABASE_URL in the production frontend.
          supabase functions deploy ai-product-draft --use-api --project-ref pcwyueagjkabmieoccew --no-verify-jwt
