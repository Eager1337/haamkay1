services:
  web:
    image: node:22-slim
    working_dir: /app
    environment:
      - NODE_ENV=development
    env_file:
      - /run/base44/app.env
    volumes:
      - .:/app
      - /app/node_modules
    ports:
      - "3000:8080"
    depends_on:
      - backend
    command: sh -c "npm install && npm run dev"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8080/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s

  backend:
    image: node:22-slim
    working_dir: /app
    env_file:
      - /run/base44/app.env
    volumes:
      - ./server:/app
      - /app/node_modules
    command: sh -c "npm install && node index.js"
